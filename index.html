<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KLIK Product Studio</title>
  <style>
    body { margin: 0; background: #111218; color: #f3f4f6; font-family: system-ui, sans-serif; padding: 14px 14px 80px; }
    .card { background: #1a1c24; border-radius: 16px; padding: 13px; margin-bottom: 12px; border: 1px solid #2a2d3a; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button { background: #7557ff; color: #fff; border: none; border-radius: 12px; padding: 11px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button.sec { background: #272a36; font-size: 12px; padding: 8px 11px; }
    .chip { background: #272a36; color: #9ca3af; border: 1px solid #383c4c; border-radius: 20px; padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .chip.on { background: #2e2459; color: #c4b5fd; border-color: #7557ff; }
    .full { width: 100%; padding: 14px; font-size: 16px; }
    select { background: #272a36; color: #fff; border: 1px solid #383c4c; border-radius: 10px; padding: 8px; font-size: 13px; }
    label { font-size: 12px; color: #9ca3af; display: inline-flex; align-items: center; gap: 5px; }
    #statusBox { display: none; background: #1f2230; border-left: 4px solid #7557ff; padding: 11px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .item { background: #1a1c24; border-radius: 16px; padding: 12px; border: 1px solid #2a2d3a; }
    .item canvas { width: 100%; border-radius: 12px; display: block; touch-action: none; cursor: grab; }
    .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 6px; flex-wrap: wrap; }
    .dots { display: flex; gap: 6px; }
    .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff6; cursor: pointer; }
    #retouchModal { display:none; position:fixed; inset:0; background:#0d0e14; z-index:99; padding:14px; flex-direction:column; }
    #retouchCanvas { flex:1; width:100%; object-fit:contain; background:repeating-conic-gradient(#222 0% 25%, #2e313d 0% 50%) 50%/20px 20px; border-radius:12px; touch-action:none; }
  </style>
</head>
<body>
  <h2 style="margin:0 0 2px;">KLIK Product Studio</h2>
  <div style="font-size:12px;color:#9ca3af;margin-bottom:14px;">Toggle Effects • Drag & Move • Magic Retouch • Smart Scenes</div>
  <div class="card">
    <div style="font-size:13px;font-weight:600;margin-bottom:8px;">1. Brand Logo & Size</div>
    <div class="row" style="margin-bottom:10px;">
      <img id="logoThumb" style="width:36px;height:36px;object-fit:contain;background:#272a36;border-radius:8px;" />
      <button class="sec" id="logoBtn">Upload Logo</button>
      <input type="file" id="logoInput" accept="image/*" hidden />
      <select id="logoPos">
        <option value="tr">Logo: Top Right</option>
        <option value="tl">Logo: Top Left</option>
        <option value="br">Logo: Bottom Right</option>
        <option value="bl">Logo: Bottom Left</option>
      </select>
      <label>Logo <input type="range" id="logoSize" min="8" max="28" value="14" style="width:65px;" /></label>
      <select id="ratioSel">
        <option value="1:1">1:1 Square</option>
        <option value="4:5">4:5 Portrait</option>
        <option value="9:16">9:16 Story</option>
        <option value="16:9">16:9 Banner</option>
      </select>
    </div>
    <div style="font-size:12px;color:#9ca3af;margin-bottom:6px;">2. Effect Tabs (Tap to Turn ON/OFF):</div>
    <div class="row">
      <button type="button" class="chip on" id="tabFloor">Floor Shadow: ON</button>
      <button type="button" class="chip on" id="tab3D">3D Border: ON</button>
      <button type="button" class="chip on" id="tabLight">Lighting: ON</button>
      <button type="button" class="chip on" id="tabArch">Scene Design: ON</button>
      <button type="button" class="chip on" id="tabClean">Auto Clean: ON</button>
    </div>
  </div>
  <div class="card">
    <button class="full" id="pickBtn">+ Select Product Photos (Batch)</button>
    <input type="file" id="batchInput" accept="image/*" multiple hidden />
    <input type="file" id="variantInput" accept="image/*" multiple hidden />
  </div>
  <div id="statusBox"></div>
  <div id="actionsBar" style="display:none;margin-bottom:12px;">
    <button class="full" style="background:#10b981;" id="downloadAllBtn">Download All HD Photos</button>
  </div>
  <div class="grid" id="gallery"></div>

  <div id="retouchModal">
    <div class="row" style="justify-content:space-between;margin-bottom:10px;">
      <strong>Cutout Retouch</strong>
      <div class="row">
        <button class="sec" id="rtCancel">Cancel</button>
        <button id="rtDone">Apply</button>
      </div>
    </div>
    <canvas id="retouchCanvas"></canvas>
    <div class="row" style="margin-top:10px;justify-content:center;">
      <button id="modeMagic">Magic Erase</button>
      <button class="sec" id="modeErase">Brush Erase</button>
      <button class="sec" id="modeRestore">Raw Restore</button>
      <label>Size <input type="range" id="brushSize" min="8" max="90" value="28" style="width:80px;" /></label>
    </div>
  </div>
  <script src="studio.js?v=9"></script>
</body>
</html>
